<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
        .box { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); width: 300px; }
        h2 { text-align: center; margin-top: 0; }
        input[type=text], input[type=password] { width: 100%; padding: .6rem; margin: .4rem 0 1rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: .7rem; background: #2c6fbb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #1e5799; }
        .msg { text-align: center; margin-bottom: 1rem; font-size: .9rem; }
        .msg.error { color: #c0392b; }
        .msg.success { color: #27ae60; }
    </style>
</head>
<body>
<div class="box">
    <h2>Sign In</h2>
    <p class="msg error" th:if="${param.error}">Invalid username or password.</p>
    <p class="msg success" th:if="${param.logout}">You have been logged out.</p>
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="text" name="username" placeholder="Username" required autofocus/>
        <input type="password" name="password" placeholder="Password" required/>
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
